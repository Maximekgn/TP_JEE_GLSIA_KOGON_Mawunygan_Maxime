spring.application.name=ega

# URL de connexion : localhost si la base est sur votre PC, 1521 est le port par défaut
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/EGA_PDB
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Vos identifiants de base de données
spring.datasource.username=maxime
spring.datasource.password=password

# Configuration JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
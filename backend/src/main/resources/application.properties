spring.application.name=ega

# URL de connexion
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/EGA_PDB
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Identifiants de base de données
spring.datasource.username=MAXIME
spring.datasource.password=password

# Configuration JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.open-in-view=false

# Configuration JWT
jwt.secret=ThisIsAVeryintSecretKeyForJWTTokenSigningAndValidationPurposesAt256Bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000
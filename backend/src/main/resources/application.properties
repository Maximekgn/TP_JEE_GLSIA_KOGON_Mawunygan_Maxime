spring.application.name=ega

# URL de connexion : localhost si la base est sur votre PC, 1521 est le port par d�faut
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/EGA_PDB
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Vos identifiants de base de donn�es
spring.datasource.username=maxime
spring.datasource.password=password

# Configuration JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuration JWT
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenSigningAndValidationPurposesAt256Bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000
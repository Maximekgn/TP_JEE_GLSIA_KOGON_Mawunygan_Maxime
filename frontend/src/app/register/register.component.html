<div class="flex items-center justify-center p-4 py-12 md:py-24">
  <div class="max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row-reverse">
    
    <!-- Right Side (Visual) - REVERSED on Register -->
    <div class="w-full md:w-1/2 bg-slate-900 text-white p-8 flex flex-col justify-center relative overflow-hidden min-h-[400px]">
      <div class="absolute inset-0 bg-red-600/20 z-0"></div>
      <div class="absolute inset-0 bg-cover bg-center opacity-40" style="background-image: url('https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');"></div>
      
      <div class="relative z-10 text-right md:text-left">
        <h2 class="text-3xl font-bold mb-4">Rejoignez-nous</h2>
        <p class="text-slate-200 mb-8">Créez votre compte en quelques minutes et profitez de tous nos avantages exclusifs.</p>
        
        <ul class="space-y-3 text-sm text-slate-300">
           <li class="flex items-center gap-2">
             <div class="bg-red-500/20 p-1 rounded-full"><svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>
             Compte courant gratuit
           </li>
           <li class="flex items-center gap-2">
             <div class="bg-red-500/20 p-1 rounded-full"><svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>
             Carte bancaire incluse
           </li>
           <li class="flex items-center gap-2">
             <div class="bg-red-500/20 p-1 rounded-full"><svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>
             Pas de frais cachés
           </li>
        </ul>
      </div>
    </div>

    <!-- Left Side (Form) -->
    <div class="w-full md:w-1/2 p-8 md:p-12">
      <div class="mt-4 mb-8">
        <h3 class="text-2xl font-bold text-slate-800">Créer un compte</h3>
        <p class="text-slate-500 text-sm mt-1">Remplissez le formulaire ci-dessous.</p>
      </div>

      <form class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
           <div>
             <label class="block text-sm font-medium text-slate-700 mb-1">Prénom</label>
             <input type="text" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-200 outline-none transition-all" placeholder="Jean" />
           </div>
           <div>
             <label class="block text-sm font-medium text-slate-700 mb-1">Nom</label>
             <input type="text" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-200 outline-none transition-all" placeholder="Dupont" />
           </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-200 outline-none transition-all" placeholder="votre@email.com" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
          <input type="password" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-200 outline-none transition-all" placeholder="••••••••" />
        </div>

        <button type="button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-red-600/30 transition-all transform hover:-translate-y-0.5 mt-2">
          S'inscrire
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-slate-600">
        Déjà client ? 
        <a routerLink="/login" class="text-red-600 font-bold hover:underline">Se connecter</a>
      </div>
    </div>
  </div>
</div>
